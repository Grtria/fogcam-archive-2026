name: fogcam-capture
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: capture
  cancel-in-progress: false
jobs:
  grab:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Capture loop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/chunk
          touch /tmp/seen
          TOTAL=0
          END=$(( $(date +%s) + 20400 ))
          CHUNK_END=$(( $(date +%s) + 3600 ))

          upload() {
            N=$(ls /tmp/chunk | wc -l)
            [ "$N" -eq 0 ] && return
            DAY=$(TZ=America/Los_Angeles date +%Y-%m-%d)
            ZIP="/tmp/fogcam_$(TZ=America/Los_Angeles date +%Y-%m-%d_%H-%M-%S).zip"
            (cd /tmp/chunk && zip -q "$ZIP" *.jpg)
            gh release view "frames-$DAY" >/dev/null 2>&1 || gh release create "frames-$DAY" --title "$DAY" --notes "Fogcam frames for $DAY"
            gh release upload "frames-$DAY" "$ZIP" --clobber && rm -f /tmp/chunk/*.jpg "$ZIP"
          }

          while [ "$(date +%s)" -lt "$END" ]; do
            if curl -sf --max-time 10 "https://fogcam.org/fogcam2.jpg?t=$(date +%s)" -o /tmp/f.jpg && [ -s /tmp/f.jpg ]; then
              H=$(sha256sum /tmp/f.jpg | cut -d' ' -f1)
              if ! grep -qx "$H" /tmp/seen; then
                echo "$H" >> /tmp/seen
                mv /tmp/f.jpg "/tmp/chunk/fogcam_$(TZ=America/Los_Angeles date +%Y-%m-%d_%H-%M-%S).jpg"
                TOTAL=$((TOTAL+1))
              fi
            fi
            if [ "$(date +%s)" -ge "$CHUNK_END" ]; then
              upload
              CHUNK_END=$(( $(date +%s) + 3600 ))
            fi
            sleep 15
          done

          gh workflow run capture.yml
          upload
          [ "$TOTAL" -gt 0 ] || { echo "no frames captured"; exit 1; }
